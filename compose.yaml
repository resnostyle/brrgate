services:
  brrgate:
    build:
      context: .
      dockerfile: Dockerfile
    image: brrgate:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Always prefer the compose-mounted path; ignoring host .env relative paths avoids
      # ./patterns.yaml resolving inside WORKDIR (/home/svc) where nothing is bind-mounted.
      PATTERNS_FILE: /config/patterns.yaml
      # Listening on all interfaces lets host port mapping reach DEBUG approvals.
      DEBUG_UI_LISTEN_ADDR: 0.0.0.0:8091
    volumes:
      # Mount a host *directory* at /config to avoid Docker creating patterns.yaml as a folder
      # when single-file binds point at paths that don't exist yet.
      - ${PATTERNS_DIR:-./config}:/config:ro
    ports:
      - "${PUBLISH_LISTEN:-8080}:8080"
      # Publish the blocking debug dashboard only when DEBUG_APPROVAL=true.
      # Bind to localhost on the Docker host unless you consciously publish it more widely.
      - "127.0.0.1:${PUBLISH_DEBUG:-8091}:8091"
