services:
  autobrr-hook:
    build:
      context: .
      dockerfile: Dockerfile
    image: autobrr-hook:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Mounted rules file matches the compose volume below.
      PATTERNS_FILE: ${PATTERNS_FILE:-/config/patterns.yaml}
      # Listening on all interfaces lets host port mapping reach DEBUG approvals.
      DEBUG_UI_LISTEN_ADDR: 0.0.0.0:8091
    volumes:
      - ${PATTERNS_PATH:-./patterns.yaml}:/config/patterns.yaml:ro
    ports:
      - "${PUBLISH_LISTEN:-8080}:8080"
      # Publish the blocking debug dashboard only when DEBUG_APPROVAL=true.
      # Bind to localhost on the Docker host unless you consciously publish it more widely.
      - "127.0.0.1:${PUBLISH_DEBUG:-8091}:8091"
